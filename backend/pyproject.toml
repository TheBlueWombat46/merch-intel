[project]
name = "merch-intel-backend"
version = "0.1.0"
description = "Merchandising Intelligence POC - API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    # Plain uvicorn: the [standard] extra pulls pyyaml, which lacks Windows wheels on new Pythons.
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder is not the alembic package.
known-third-party = ["alembic"]
