# Local PostgreSQL for development and tests.
# Start:  docker compose up -d --wait
# Stop:   docker compose down        (data is kept in the pgdata volume)
# Reset:  docker compose down -v     (deletes all local data)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: merch
      POSTGRES_PASSWORD: merch
      POSTGRES_DB: merch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on first start: creates the separate merch_test database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merch -d merch"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
